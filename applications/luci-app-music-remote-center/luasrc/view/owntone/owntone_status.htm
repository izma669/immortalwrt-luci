<script type="text/javascript">//<![CDATA[
var lastNpText = '';
var lastNpColor = '';

function updateMarquee(htmlStr, color) {
    var np = document.getElementById('owntone_now_playing');
    if (!np) return;

    if (color && np.style.color !== color) {
        np.style.color = color;
    }

    if (htmlStr === lastNpText) return;
    lastNpText = htmlStr;

    if (!htmlStr) {
        np.innerHTML = '';
        return;
    }

    np.innerHTML = '<span class="marquee-content">' + htmlStr + '</span>';
}

// ★ 播放控制函数
function playerControl(action, btn) {
    btn = btn || window.event.target;
    var oldText = btn.innerText;
    btn.disabled = true;
    btn.innerText = '...';

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '<%=url([[admin]], [[nas]], [[owntone]], [[player_control]])%>', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            btn.disabled = false;
            btn.innerText = oldText;
            if (xhr.status !== 200) {
                var errMsg = '控制失败，请检查后端日志。';
                try {
                    var res = JSON.parse(xhr.responseText);
                    if (res && res.error) { errMsg = res.error; }
                } catch(e) {}
                alert(errMsg);
            }
        }
    };
    xhr.send('action=' + action);
}

XHR.poll(3, '<%=url([[admin]], [[nas]], [[owntone]], [[status]])%>', null,
    function(x, data) {
        try {
            var tb = document.getElementById('owntone_status');
            var np = document.getElementById('owntone_now_playing');
            if (!tb || !np) return;

            if (data && data.running) {
                var links = "<em><b><font color=green>Music Remote Center <%:RUNNING%></font></b>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input type=button value='<%:Open Web Interface%>' onclick=window.open('http://'+window.location.hostname+':3689') /></em>";
                tb.innerHTML = links;

                // ★ 根据 state 精确判断状态和颜色
                var stateText = '';
                var stateColor = '#888';
                if (data.state === 'play') { stateText = '播放中'; stateColor = '#080'; }
                else if (data.state === 'pause') { stateText = '已暂停'; stateColor = '#c80'; }
                else if (data.state === 'stop') { stateText = '已停止'; stateColor = '#666'; }
                else { stateText = '正在缓冲'; stateColor = '#888'; }

                if (data.title && data.title.length > 0) {
                    var text = '[' + stateText + '] '
                        + '<span style="color: #06c; font-weight: bold;">'
                        + '曲名：' + data.title
                        + (data.artist ? ' 演唱者：' + data.artist : '')
                        + (data.album ? ' 专辑：' + data.album : '')
                        + '</span>';
                    updateMarquee(text, stateColor);
                } else {
                    updateMarquee('[' + stateText + '] 暂无曲目信息', stateColor);
                }

            } else {
                tb.innerHTML = '<em><b><font color=red>Music Remote Center <%:NOT RUNNING%></font></b></em>';
                updateMarquee('', '');
            }
        } catch(e) {
            console.log('Poll parse error:', e);
        }
    }
);
//]]>
</script>

<style>
/* 跑马灯容器 */
#owntone_now_playing {
    overflow: hidden;
    white-space: nowrap;
    width: 100%;
    box-sizing: border-box;
    margin-top: 8px;
}

/* 跑马灯内容 */
.marquee-content {
    display: inline-block;
    white-space: nowrap;
    padding-left: 100%;
    animation: marquee-scroll 15s linear infinite;
}

@keyframes marquee-scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
}
</style>

<fieldset class="cbi-section">
    <p id="owntone_status">
        <em><%:Collecting data...%></em>
    </p>
    <p id="owntone_now_playing">
        <em></em>
    </p>

    <!-- ★ 控制按钮组 -->
    <div style="margin-top: 15px; display: flex; gap: 10px; align-items: center;">
        <button type="button" class="cbi-button" onclick="playerControl('previous', this)">⏮ 上一曲</button>
        <button type="button" class="cbi-button cbi-button-apply" style="font-weight: bold;" onclick="playerControl('toggle', this)">⏯ 播放/暂停</button>
        <button type="button" class="cbi-button" onclick="playerControl('next', this)">⏭ 下一曲</button>
        <span id="player_ctrl_status" style="color:#888;font-size:12px;margin-left:5px;"></span>
    </div>
</fieldset>
