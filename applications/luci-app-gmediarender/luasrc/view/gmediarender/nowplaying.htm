<style>
    #gmr-np-artwrap {
        position: relative;
        width: 260px;
        height: 260px;
        flex-shrink: 0;
    }
    #gmr-np-art {
        width: 260px;
        height: 260px;
        border-radius: 50%;
        object-fit: cover;
        display: none;
        box-shadow: 0 6px 20px rgba(0,0,0,0.18);
        background: #ddd;
        animation: gmr-spin 24s linear infinite;
        animation-play-state: paused;
    }
    #gmr-np-noart {
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: #e4e8ee;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #a0a6b0;
        font-size: 15px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }
    /* 中心的小圆孔，模拟唱片 */
    #gmr-np-artwrap::after {
        content: "";
        position: absolute;
        top: 50%; left: 50%;
        width: 34px; height: 34px;
        margin: -17px 0 0 -17px;
        border-radius: 50%;
        background: radial-gradient(circle, #f8f9fb 40%, #ddd 42%, #bbb 70%, #999 72%);
        box-shadow: inset 0 0 4px rgba(0,0,0,0.35);
        pointer-events: none;
        display: none;
    }
    #gmr-np-artwrap.has-art::after { display: block; }
    @keyframes gmr-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
    }
</style>

<script type="text/javascript">
    XHR.poll(3, '<%=url("admin/services/gmediarender/nowplaying")%>', null,
        function(x, data) {
            var wrap     = document.getElementById('gmr-np-artwrap');
            var elArt    = document.getElementById('gmr-np-art');
            var elNoArt  = document.getElementById('gmr-np-noart');
            var elTitle  = document.getElementById('gmr-np-title');
            var elArtist = document.getElementById('gmr-np-artist');
            var elAlbum  = document.getElementById('gmr-np-album');
            var elState  = document.getElementById('gmr-np-state');
            var elPos    = document.getElementById('gmr-np-pos');
            var elMedia  = document.getElementById('gmr-np-media');
            // 修改点1：替换原有的 elAudio，改为 elVol 和 elSC
            var elVol    = document.getElementById('gmr-np-vol');
            var elSC     = document.getElementById('gmr-np-soundcard');
            var elUrl    = document.getElementById('gmr-np-url');
            var elDl     = document.getElementById('gmr-np-dlbtn');
            if (!elTitle) return;

            if (!data || (!data.title && !data.artist)) {
                elState.innerHTML  = '<span style="color:#c98b00;">空闲</span>';
                elTitle.innerHTML  = '<span style="color:#999; font-style:italic;">暂无播放</span>';
                elArtist.innerHTML = '-';
                elAlbum.innerHTML  = '-';
                elPos.innerHTML    = '-';
                elMedia.innerHTML  = '-';
                // 修改点2：空闲状态清空音量和声卡
                if (elVol) elVol.innerHTML = '-';
                if (elSC)  elSC.innerHTML  = '-';
                if (elUrl) elUrl.textContent = '-';
                if (elDl)  elDl.setAttribute('href', '#');
                if (wrap)  wrap.classList.remove('has-art');
                if (elArt)   elArt.style.display = 'none';
                if (elNoArt) elNoArt.style.display = 'flex';
            } else {
                elState.innerHTML  = data.playing
                    ? '<span style="color:green; font-weight:bold;">播放中</span>'
                    : '<span style="color:#c98b00;">暂停</span>';
                elTitle.innerHTML  = data.title  || '-';
                elArtist.innerHTML = data.artist || '-';
                elAlbum.innerHTML  = data.album  || '-';
                elPos.innerHTML    = (data.position || '0:00:00') +
                                     ' / ' + (data.duration || '-');

                // 媒体信息：类型 · 格式 · 音质 （码率为估值，去掉不显示）
                var mb = [];
                if (data.mediatype) mb.push(data.mediatype);
                if (data.format)    mb.push(data.format);
                if (data.quality)   mb.push(data.quality);
                elMedia.innerHTML = mb.length ? mb.join(' · ') : '-';

                // 修改点3：参照右侧 AirPlay2，显示音量与输出声卡
                if (elVol) elVol.innerHTML = (data.volume || 0) + '%';
                if (elSC)  elSC.innerHTML  = data.soundcard || '-';

                if (elUrl) elUrl.textContent = data.streamurl || '-';
                if (elDl && data.streamurl) {
                    elDl.setAttribute('href', data.streamurl);
                } else if (elDl) {
                    elDl.setAttribute('href', '#');
                }

                if (data.albumart && data.albumart.length > 5) {
                    if (elArt.src !== data.albumart) elArt.src = data.albumart;
                    elArt.style.display = 'block';
                    elNoArt.style.display = 'none';
                    if (wrap) wrap.classList.add('has-art');

                    // 播放中才旋转，暂停/停止则停转
                    elArt.style.animationPlayState =
                        (data.playing ? 'running' : 'paused');
                } else {
                    elArt.style.display = 'none';
                    elNoArt.style.display = 'flex';
                    if (wrap) wrap.classList.remove('has-art');
                }
            }
        }
    );

    function gmrArtError() {
        var wrap     = document.getElementById('gmr-np-artwrap');
        var elArt    = document.getElementById('gmr-np-art');
        var elNoArt  = document.getElementById('gmr-np-noart');
        if (elArt && elNoArt) {
            elArt.style.display = 'none';
            elNoArt.style.display = 'flex';
        }
        if (wrap) wrap.classList.remove('has-art');
    }

    function gmrCopyUrl() {
        var elUrl = document.getElementById('gmr-np-url');
        if (!elUrl || !elUrl.textContent || elUrl.textContent === '-') return;
        var t = document.createElement('textarea');
        t.value = elUrl.textContent;
        document.body.appendChild(t);
        t.select();
        try { document.execCommand('copy'); } catch(e) {}
        document.body.removeChild(t);
        var btn = document.getElementById('gmr-np-copybtn');
        if (btn) {
            btn.textContent = '已复制!';
            setTimeout(function(){ btn.textContent = '复制'; }, 1500);
        }
    }

    function gmrCollapseBasicSettings() {
        var sections = document.querySelectorAll('.cbi-section');
        for (var i = 0; i < sections.length; i++) {
            var s = sections[i];
            if (s.dataset.gmrCollapsed) continue;
            var titleEl = s.querySelector('h3, legend');
            if (!titleEl) continue;
            var t = (titleEl.textContent || '').trim();
            if (t !== '基本设置') continue;
            s.dataset.gmrCollapsed = '1';

            var det = document.createElement('details');
            det.style.cssText = 'margin: 12px 0; padding: 8px 14px; background: #fafbfc; border: 1px solid #e4e7ec; border-radius: 8px;';
            var sum = document.createElement('summary');
            sum.textContent = t;
            sum.style.cssText = 'cursor: pointer; font-weight: 600; padding: 6px 0; user-select: none; color: #333; list-style: none;';
            titleEl.style.display = 'none';
            s.parentNode.insertBefore(det, s);
            det.appendChild(sum);
            det.appendChild(s);
            det.open = false;
            break;
        }
    }

    if (window.addEventListener) {
        window.addEventListener('load', function() { setTimeout(gmrCollapseBasicSettings, 100); });
    } else {
        window.onload = function() { setTimeout(gmrCollapseBasicSettings, 100); };
    }
</script>

<div class="cbi-section" style="
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 28px;
    padding: 22px;
    background: linear-gradient(135deg, #f8f9fb 0%, #eef1f6 100%);
    border: 1px solid #d8dde5;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
">
    <div id="gmr-np-artwrap">
        <img id="gmr-np-art" src="" onerror="gmrArtError()" alt="封面" />
        <div id="gmr-np-noart">暂无封面</div>
    </div>

    <div style="flex: 1 1 320px; min-width: 0;">
        <table class="table" style="margin: 0; table-layout: fixed; width: 100%;">
            <tr>
                <td style="color:#666; padding: 6px 0; width: 75px; white-space: nowrap;">状态</td>
                <td id="gmr-np-state" style="padding: 6px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">-</td>
            </tr>
            <tr>
                <td style="color:#666; padding: 6px 0; width: 75px; white-space: nowrap;">歌曲</td>
                <td id="gmr-np-title" style="padding: 6px 0; font-weight: 600; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">-</td>
            </tr>
            <tr>
                <td style="color:#666; padding: 6px 0; width: 75px; white-space: nowrap;">艺术家</td>
                <td id="gmr-np-artist" style="padding: 6px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">-</td>
            </tr>
            <tr>
                <td style="color:#666; padding: 6px 0; width: 75px; white-space: nowrap;">专辑</td>
                <td id="gmr-np-album" style="padding: 6px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">-</td>
            </tr>
            <tr>
                <td style="color:#666; padding: 6px 0; width: 75px; white-space: nowrap;">进度</td>
                <td id="gmr-np-pos" style="padding: 6px 0; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">-</td>
            </tr>
            <tr>
                <td style="color:#666; padding: 6px 0; width: 75px; white-space: nowrap;">媒体信息</td>
                <td id="gmr-np-media" style="padding: 6px 0; color: #555; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">-</td>
            </tr>
            <!-- 修改点4：参照右侧 AirPlay 2，将“音频”修改为“音频设备”，并显示音量和输出声卡 -->
            <tr>
                <td style="color:#666; padding: 6px 0; width: 75px; white-space: nowrap;">音频设备</td>
                <td style="padding: 6px 0; color: #555; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                    音量：<span id="gmr-np-vol">-</span>
                    &nbsp;&nbsp;
                    输出声卡：<span id="gmr-np-soundcard" style="color:#666;font-size:12px;">-</span>
                </td>
            </tr>
        </table>

        <div style="margin-top: 10px;">
            <div style="color:#888; font-size:12px; margin-bottom: 4px;">音频源地址</div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start;">
                <code id="gmr-np-url" style="
                    flex: 1 1 200px;
                    font-size: 11px;
                    color: #555;
                    background: #fff;
                    padding: 6px 8px;
                    border-radius: 4px;
                    border: 1px solid #e0e4ea;
                    white-space: pre-wrap;
                    word-break: break-all;
                    max-height: 120px;
                    overflow: auto;
                ">-</code>
                <button id="gmr-np-copybtn" type="button" onclick="gmrCopyUrl()"
                    style="
                        flex-shrink: 0;
                        font-size: 11px;
                        padding: 4px 10px;
                        border: 1px solid #c7ccd4;
                        background: #fff;
                        border-radius: 4px;
                        cursor: pointer;
                        color: #555;
                    ">复制</button>
                <a id="gmr-np-dlbtn" href="#" target="_blank" rel="noopener noreferrer"
                    style="
                        flex-shrink: 0;
                        font-size: 11px;
                        padding: 4px 10px;
                        border: 1px solid #4a90e2;
                        background: #4a90e2;
                        border-radius: 4px;
                        cursor: pointer;
                        color: #fff;
                        text-decoration: none;
                        line-height: 1.4;
                    ">浏览器打开</a>
            </div>
        </div>
    </div>
</div>
