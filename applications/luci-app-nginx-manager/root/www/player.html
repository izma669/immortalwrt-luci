<div style="margin-bottom:10px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span id="dlna-seek-label" style="color:#4a9eff; font-size:13px; font-variant-numeric:tabular-nums;">00:00:00</span>
        <span id="dlna-duration-label" style="color:#ccc; font-size:11px;">总时长: --:--:--</span>
    </div>
    <input type="range" id="dlna-seek-bar" min="0" max="100" value="0" step="1" 
           oninput="window.isDlnaDragging=true; updateSeekDisplay(this.value);" 
           onchange="window.isDlnaDragging=false; executeSeek(this.value);" style="width:100%;">
</div>
