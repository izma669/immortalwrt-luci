server {
    listen 880 default_server;
    listen [::]:880 default_server;
    server_name localhost;
    root /mnt;

    # 让 nginx 从 /www 读播放器（不依赖 /mnt）
    location = /player.html {
        root /www;
    }

    # JSON 目录 API（加 CORS 头允许 LuCI 跨端口访问）
    location /api/dir/ {
        alias /mnt/;
        autoindex on;
        autoindex_format json;
        autoindex_exact_size on;
    }

    # 视频/音频：支持 Range
    location ~* \.(mp4|webm|mkv|mov|avi|m4v|ogv|flv|3gp|ts|m2ts|wmv|mp3|m4a|flac|aac|ogg|wav)$ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600";
    }

    # 播放器 fallback
    location @player {
        rewrite ^ /player.html last;
    }

    # 一切请求：如果是真实文件就返回，否则走播放器
    location / {
        index /player.html;
        try_files $uri @player;
    }
}
