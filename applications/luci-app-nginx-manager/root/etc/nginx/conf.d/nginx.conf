server {
    listen 880 default_server;
    listen [::]:880 default_server;
    server_name localhost;
    root /mnt;

    # ★ 新增：让 nginx 从 /www 读播放器（不依赖 /mnt）
    location = /player.html {
        root /www;
    }

    location = /mpegts.min.js {
        root /www;
    }

    location /api/dir/ {
        alias /mnt/;
        autoindex on;
        autoindex_format json;
        autoindex_exact_size on;
    }

    location ~* \.(mp4|webm|mkv|mov|avi|m4v|ogv|flv|3gp|ts|m2ts|wmv|mp3|m4a|flac|aac|ogg|wav)$ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600";
    }

    location @player {
        rewrite ^ /player.html last;
    }

    location / {
        index /player.html;
        try_files $uri @player;
    }
}
