server {
    listen 880 default_server;
    listen [::]:880 default_server;
    server_name localhost;
    root /mnt;

    # ===== 播放器相关（从 /www 读，不依赖 /mnt）=====

    # 播放器主页面
    location = /player.html {
        root /www;
    }

    # TS 播放依赖库（mpegts.js）
    location = /mpegts.min.js {
        root /www;
    }

    # ===== 媒体文件服务 =====

    # 目录 JSON 列表 API（供播放器前端调用）
    location /api/dir/ {
        alias /mnt/;
        autoindex on;
        autoindex_format json;
        autoindex_exact_size on;
    }

    # 视频/音频：支持 Range 拖动
    location ~* \.(mp4|webm|mkv|mov|avi|m4v|ogv|flv|3gp|ts|m2ts|wmv|mp3|m4a|flac|aac|ogg|wav)$ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600";
    }

    # ===== 其他请求：先找真实文件，找不到就回退到播放器 =====

    location / {
        try_files $uri /player.html;
    }
}
