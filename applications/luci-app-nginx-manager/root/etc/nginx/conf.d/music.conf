# =============================================================================
# 音乐中心（Music Center）—— 888 端口
#
#   http://<路由器局域网地址>:888/
#
# 页面是纯静态文件（/www/music-center/），不需要登录 LuCI。
# 数据接口走 /cgi-bin/luci/music/*，由 luci.controller.music 提供；
# 该控制器不带 admin 前缀，所以同样免登录，但只接受内网来源。
#
# 依赖：nginx 主配置里已经 include /etc/nginx/conf.d/*.conf
# 修改端口后记得：nginx -t && /etc/init.d/nginx reload
# =============================================================================
server {
    listen 888;
    listen [::]:888;
    server_name _;

    root /www/music-center;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # 页面本身不缓存，升级后刷新即可看到新版本
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # 静态资源带 ?v= 版本号，可以放心缓存
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # 音乐中心 API：转发给本机 LuCI/uhttpd
    # 只代理 music 命名空间，不把整个 /cgi-bin/luci/ 暴露到 888。
    location /cgi-bin/luci/music/ {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 10s;
        proxy_buffering off;
        proxy_hide_header Cache-Control;

        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }
}
