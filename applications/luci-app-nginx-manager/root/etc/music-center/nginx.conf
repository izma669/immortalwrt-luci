# =============================================================================
# 音乐中心 / 媒体服务器 —— 插件自己的 nginx 实例
#
# 由 /etc/init.d/music-center 里的 music-center-daemon 启动：
#   nginx -c /etc/music-center/nginx.conf
#
# 不放进 /etc/nginx/conf.d，不依赖系统 nginx 的 include，
# 不改 /etc/nginx/uci.conf、/etc/nginx/nginx.conf、/etc/config/nginx。
#
# 端口配置在 /etc/music-center/servers/：
#   888.conf  音乐中心页面 + API
#   880.conf  媒体服务器
# =============================================================================

user root;
worker_processes 1;
error_log /var/log/music-center-nginx.log warn;
pid /var/run/music-center-nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    access_log off;
    server_tokens off;
    client_max_body_size 128m;

    include /etc/music-center/servers/*.conf;
}
