server {
    listen 880 default_server;
    listen [::]:880 default_server;
    server_name _lan;

    location = /player.html { root /www; }
    location = /caster.html { root /www; }
    location = /mpegts.min.js { root /www; }
    location = /hls.min.js { root /www; }

    location /cgi-bin/luci/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Allow-Private-Network "true" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Vary "Origin" always;
            return 204;
        }
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/dir/ {
        alias /mnt/;
        autoindex on;
        autoindex_format json;
        autoindex_exact_size on;
        charset utf-8;
        default_type application/json;
    }

    location ~* \.(mp4|webm|mkv|mov|avi|m4v|ogv|flv|3gp|ts|m2ts|wmv|mp3|m4a|flac|aac|ogg|wav)$ {
        root /mnt;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        root /mnt;
        try_files $uri /player.html;
    }
}
