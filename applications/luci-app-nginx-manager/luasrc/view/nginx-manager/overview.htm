<%+header%>

<%=cbi%>

<!-- 目录浏览弹窗 -->
<div id="browse-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;">
    <div style="background:#fff;padding:20px;border-radius:6px;min-width:520px;max-width:80vw;box-shadow:0 4px 20px rgba(0,0,0,.3);">
        <h3 style="margin:0 0 10px 0;">浏览 /mnt 目录</h3>
        <div style="margin-bottom:10px;padding:8px;background:#f0f7ff;border-radius:4px;">
            当前位置：<code id="browse-path" style="color:#4a9eff;">/mnt</code>
        </div>
        <div id="browse-list" style="max-height:380px;min-height:200px;overflow-y:auto;border:1px solid #ddd;border-radius:4px;background:#fff;"></div>
        <div style="text-align:right;margin-top:15px;">
            <button type="button" class="cbi-button cbi-button-neutral" onclick="closeBrowser()">取消</button>
            <button type="button" class="cbi-button cbi-button-action" onclick="pickBrowser()">选择此目录</button>
        </div>
    </div>
</div>

<script type="text/javascript">
var browseCurrent = "/mnt";

// 页面加载后在"网站根目录"字段旁注入"浏览选择"按钮
(function() {
    function injectBrowseButton() {
        var inputs = document.querySelectorAll('input');
        for (var i = 0; i < inputs.length; i++) {
            var nm = inputs[i].getAttribute('name') || '';
            if (nm.indexOf('._root') >= 0 || nm.indexOf('_root') === 0) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'cbi-button cbi-button-neutral';
                btn.style.marginLeft = '8px';
                btn.textContent = '📂 浏览选择';
                btn.onclick = openBrowser;
                inputs[i].parentNode.appendChild(btn);
                return true;
            }
        }
        return false;
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', injectBrowseButton);
    } else {
        injectBrowseButton();
    }
})();

function openBrowser() {
    document.getElementById('browse-modal').style.display = 'flex';
    browseLoad('/mnt');
}

function closeBrowser() {
    document.getElementById('browse-modal').style.display = 'none';
}

function pickBrowser() {
    var inputs = document.querySelectorAll('input');
    for (var i = 0; i < inputs.length; i++) {
        var nm = inputs[i].getAttribute('name') || '';
        if (nm.indexOf('_root') >= 0) {
            inputs[i].value = browseCurrent;
            break;
        }
    }
    closeBrowser();
}

function browseLoad(path) {
    browseCurrent = path;
    document.getElementById('browse-path').textContent = path;
    var list = document.getElementById('browse-list');
    list.innerHTML = "<div style='padding:14px;color:#888;'>加载中...</div>";
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'browse?path=' + encodeURIComponent(path), true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            if (xhr.status === 200) {
                try {
                    renderBrowseList(JSON.parse(xhr.responseText));
                } catch(e) {
                    list.innerHTML = "<div style='padding:14px;color:#d32f2f;'>解析失败：" + e.message + "</div>";
                }
            } else {
                list.innerHTML = "<div style='padding:14px;color:#d32f2f;'>HTTP " + xhr.status + "</div>";
            }
        }
    };
    xhr.send();
}

function renderBrowseList(entries) {
    var list = document.getElementById('browse-list');
    list.innerHTML = '';

    if (browseCurrent !== '/mnt') {
        var parent = browseCurrent.replace(/\/+$/, '').replace(/\/[^\/]+$/, '') || '/mnt';
        if (parent.length < 4) parent = '/mnt';
        var up = document.createElement('div');
        up.style.cssText = 'padding:8px 12px;cursor:pointer;color:#ff9800;border-bottom:1px solid #eee;';
        up.textContent = '📁 ..  (上级目录)';
        up.onclick = function() { browseLoad(parent); };
        up.onmouseover = function() { this.style.background = '#fff8e1'; };
        up.onmouseout = function() { this.style.background = ''; };
        list.appendChild(up);
    }

    if (!entries || entries.length === 0) {
        var empty = document.createElement('div');
        empty.style.cssText = 'padding:14px;color:#888;';
        empty.textContent = '(此目录下无子目录)';
        list.appendChild(empty);
        return;
    }

    entries.forEach(function(name) {
        var item = document.createElement('div');
        item.style.cssText = 'padding:8px 12px;cursor:pointer;border-bottom:1px solid #eee;';
        item.textContent = '📁 ' + name;
        item.onclick = function() { browseLoad(browseCurrent.replace(/\/+$/, '') + '/' + name); };
        item.onmouseover = function() { this.style.background = '#f0f7ff'; };
        item.onmouseout = function() { this.style.background = ''; };
        list.appendChild(item);
    });
}
</script>

<%+footer%>
